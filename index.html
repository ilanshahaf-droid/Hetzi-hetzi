<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2940">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חצי חצי">
<title>חצי חצי – הוצאות הילדים</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F4; --surface:#FFFFFF; --ink:#1E2940; --muted:#66707F; --line:#DCE1DA;
  --plus:#3F7A5A; --minus:#A94F38; --accent:#1E2940; --chip:#E8ECE6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#141A24; --surface:#1C2330; --ink:#E7EBF0; --muted:#98A1AE; --line:#2E3746;
    --plus:#7BC29B; --minus:#E58E77; --accent:#E7EBF0; --chip:#262F3E; }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Assistant","Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:"Frank Ruhl Libre",Georgia,serif;font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{font-weight:700;font-size:18px}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;color:var(--muted);font-size:15px}

.hero{padding:6px 0 26px;border-bottom:1px solid var(--line)}
.hero .who{font-size:20px;font-weight:600;margin:0}
.hero .amount{font-size:clamp(56px,17vw,88px);font-weight:700;line-height:1.05;margin:6px 0 14px;display:block}
.hero.plus .amount{color:var(--plus)} .hero.minus .amount{color:var(--minus)}
.hero .sub{color:var(--muted);font-size:15px;margin:0 0 16px}
.settle{background:none;border:1.5px solid var(--ink);border-radius:999px;padding:8px 18px;font-weight:600;font-size:15px}
.offline{font-size:14px;color:var(--minus);margin-top:12px}

.monthbar{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px}
.monthbar h2{margin:0;font-size:22px;font-weight:700}
.monthbar .arrows{display:flex;gap:4px}
.monthbar .arrows button{background:var(--chip);border:0;width:38px;height:38px;border-radius:50%;font-size:18px}
table.sum{width:100%;border-collapse:collapse;margin:8px 0 4px}
table.sum th,table.sum td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right}
table.sum th{font-size:14px;color:var(--muted);font-weight:600}
table.sum td.v{text-align:left;font-size:19px;font-weight:700}
table.sum th.c{text-align:left}
.monthres{font-size:16px;margin:10px 0 0;font-weight:600}
.monthres .plus{color:var(--plus)} .monthres .minus{color:var(--minus)}
.tools{display:flex;gap:18px;margin:12px 0 4px;flex-wrap:wrap}
.tools button,.link{background:none;border:0;padding:4px 0;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px}

.day{font-size:14px;color:var(--muted);margin:20px 0 2px;font-weight:600}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:right}
.row .d{font-weight:600}
.row .m{font-size:14px;color:var(--muted)}
.row .a{font-size:18px;font-weight:700;justify-self:end}
.row .e{font-size:14px;justify-self:end}
.row .e.plus{color:var(--plus)} .row .e.minus{color:var(--minus)}
.row.transfer .d{font-weight:400;font-style:italic}
.empty{padding:34px 0;color:var(--muted);text-align:center}
.empty .settle{margin-top:14px;color:var(--ink)}

.fab{position:fixed;bottom:0;left:0;right:0;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.fab button{pointer-events:auto;background:var(--accent);color:var(--paper);border:0;border-radius:999px;padding:15px 34px;font-size:18px;font-weight:700;box-shadow:0 6px 20px rgba(20,30,50,.25)}

.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:up .22s ease-out}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 14px;font-size:20px}
.sheet h4{margin:22px 0 6px;font-size:16px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=date],input[type=email],input[type=password],textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.amtbox{display:flex;align-items:center;direction:ltr;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.amtbox span{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:30px;color:var(--muted);padding-right:6px}
.amtbox input{border:0!important;background:none!important;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:34px;font-weight:700;padding:8px 0!important;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:15px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips button.add{border-style:dashed;color:var(--muted)}
.preview{margin-top:14px;font-size:15px;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:20px}
.primary{flex:1;background:var(--accent);color:var(--paper);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:17px}
.primary:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-weight:600}
.danger{color:var(--minus);border-color:var(--minus)}
.err{color:var(--minus);font-size:14px;min-height:1em;margin-top:8px}
.ok{color:var(--plus);font-size:15px;margin-top:8px}
.catrow{display:flex;gap:8px;margin-bottom:8px}
.catrow input{flex:1;padding:9px 12px!important}
.catrow button{background:none;border:1px solid var(--line);border-radius:12px;width:44px;color:var(--minus);font-size:18px}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acct{font-size:14px;color:var(--muted);margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:15px;z-index:20;display:none}
textarea{min-height:240px;font-size:15px;line-height:1.5}

/* auth */
.auth{max-width:420px;margin:0 auto;padding:12vh 22px 40px}
.auth .logo{width:64px;height:64px;border-radius:16px;display:block;margin-bottom:18px}
.auth h1{font-size:34px;margin:0 0 4px}
.auth p.lead{color:var(--muted);margin:0 0 26px}
.auth .actions{flex-direction:column}
.loading{padding:30vh 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<div class="loading" id="loadingView">טוען…</div>

<!-- ================= AUTH ================= -->
<section class="auth" id="authView" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>חצי חצי</h1>
  <p class="lead">הוצאות והכנסות של הילדים, מתחלקות שווה בשווה.</p>
  <label class="f" for="aEmail">אימייל</label>
  <input id="aEmail" type="email" autocomplete="email" dir="ltr">
  <label class="f" for="aPass">סיסמה</label>
  <input id="aPass" type="password" autocomplete="current-password" dir="ltr">
  <div class="err" id="aErr"></div>
  <div class="ok" id="aMsg"></div>
  <div class="actions">
    <button class="primary" id="aLogin">כניסה</button>
    <button class="ghost" id="aSignup">הרשמה</button>
  </div>
  <button class="link" id="aForgot" style="margin-top:14px">שכחתי סיסמה</button>
</section>

<!-- ================= APP ================= -->
<div id="appView" hidden>
<div class="wrap">
  <header class="top">
    <span class="brand">הוצאות הילדים</span>
    <button class="iconbtn" id="btnSettings">הגדרות</button>
  </header>

  <section class="hero" id="hero" aria-live="polite">
    <p class="who" id="heroWho"></p>
    <span class="amount num ltr" id="heroAmt"></span>
    <p class="sub" id="heroSub"></p>
    <button class="settle" id="btnSettle" hidden>רישום התחשבנות</button>
    <div class="offline" id="offlineNote" hidden>אין חיבור לאינטרנט. מוצגים הנתונים האחרונים שנטענו; שינויים יתאפשרו כשהחיבור יחזור.</div>
  </section>

  <div class="monthbar">
    <h2 id="monthTitle"></h2>
    <div class="arrows">
      <button id="prevM" aria-label="חודש קודם">›</button>
      <button id="nextM" aria-label="חודש הבא">‹</button>
    </div>
  </div>
  <table class="sum">
    <thead><tr><th></th><th class="c" id="thA"></th><th class="c" id="thB"></th></tr></thead>
    <tbody>
      <tr><th>הוצאות</th><td class="v num"><span class="ltr" id="expA"></span></td><td class="v num"><span class="ltr" id="expB"></span></td></tr>
      <tr><th>הכנסות</th><td class="v num"><span class="ltr" id="incA"></span></td><td class="v num"><span class="ltr" id="incB"></span></td></tr>
    </tbody>
  </table>
  <p class="monthres" id="monthRes"></p>
  <div class="tools">
    <button id="btnCopy">סיכום לשליחה</button>
    <button id="btnCsv">ייצוא לאקסל</button>
  </div>

  <div id="list"></div>
</div>
<div class="fab"><button id="btnAdd">+ רישום חדש</button></div>
</div>

<!-- entry sheet -->
<div class="scrim" id="entryScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
    <h3 id="entryTitle">רישום חדש</h3>
    <div class="seg" id="typeSeg">
      <button data-v="expense">הוצאה</button>
      <button data-v="income">הכנסה / החזר</button>
      <button data-v="transfer">העברה ביניכם</button>
    </div>
    <label class="f" for="fAmt">סכום</label>
    <div class="amtbox"><span>₪</span><input id="fAmt" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
    <label class="f" id="whoLbl">מי שילם?</label>
    <div class="seg" id="whoSeg">
      <button data-v="a" id="whoA"></button>
      <button data-v="b" id="whoB"></button>
    </div>
    <div id="descBlock">
      <label class="f" for="fDesc">על מה</label>
      <input id="fDesc" type="text" list="descList" placeholder="למשל: איילה חוג כדורגל" autocomplete="off">
      <datalist id="descList"></datalist>
      <label class="f">קטגוריה</label>
      <div class="chips" id="catChips"></div>
    </div>
    <label class="f" for="fDate">תאריך</label>
    <input id="fDate" type="date">
    <div class="preview" id="fPreview"></div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      <button class="primary" id="fSave">שמירה</button>
      <button class="ghost danger" id="fDel" hidden>מחיקה</button>
      <button class="ghost" id="fCancel">ביטול</button>
    </div>
  </div>
</div>

<!-- settings sheet -->
<div class="scrim" id="setScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h3 id="setTitle">הגדרות</h3>
    <h4>שמות ההורים</h4>
    <div class="namegrid">
      <input id="sNameA" type="text" placeholder="אילן" aria-label="הורה ראשון">
      <input id="sNameB" type="text" placeholder="קרן" aria-label="הורה שני">
    </div>
    <h4>קטגוריות</h4>
    <div id="catEditor"></div>
    <div class="catrow">
      <input id="newCat" type="text" placeholder="קטגוריה חדשה">
      <button id="addCat" aria-label="הוספת קטגוריה" style="color:var(--ink)">+</button>
    </div>
    <div class="err" id="sErr"></div>
    <div class="actions">
      <button class="primary" id="sSave">שמירה</button>
      <button class="ghost" id="sCancel">ביטול</button>
    </div>
    <div class="acct"><span id="acctEmail"></span><button class="link" id="btnLogout">התנתקות</button></div>
  </div>
</div>

<!-- summary sheet -->
<div class="scrim" id="sumScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sumTitle">
    <h3 id="sumTitle">סיכום חודשי</h3>
    <textarea id="sumText" readonly></textarea>
    <div class="actions">
      <button class="primary" id="sumShare">שיתוף</button>
      <button class="ghost" id="sumCopy">העתקה</button>
      <button class="ghost" id="sumClose">סגירה</button>
    </div>
  </div>
</div>

<!-- new password sheet -->
<div class="scrim" id="pwScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
    <h3 id="pwTitle">סיסמה חדשה</h3>
    <input id="pwNew" type="password" autocomplete="new-password" dir="ltr" placeholder="לפחות 6 תווים">
    <div class="err" id="pwErr"></div>
    <div class="actions"><button class="primary" id="pwSave">עדכון סיסמה</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
